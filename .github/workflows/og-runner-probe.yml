name: OG runner compatibility probe

on:
  push:
    branches: [wip/og-ci-probe-2026-11-03]

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout without write credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: '3.12'
      - name: Install the workflow's browser dependencies
        run: |
          pip install playwright==1.58.0 toml --quiet
          playwright install chromium --with-deps
      - name: Render a real tool to temporary storage
        run: |
          python - <<'PY'
          import importlib.util
          import os
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          spec = importlib.util.spec_from_file_location("og", "scripts/og-generator/generate_og.py")
          og = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(og)
          tools = og.load_tool_data()
          if not tools:
              raise RuntimeError("No tool data to render")
          tool = tools[0]
          temp = Path(os.environ["RUNNER_TEMP"]) / "og-probe"
          temp.mkdir()
          og.OUTPUT_DIR = temp
          og.HASH_PATH = temp / "hashes.json"
          og.generate_images([tool], og.TEMPLATE_PATH.read_text(encoding="utf-8"))
          image = temp / f"{tool['slug']}.jpg"
          if not image.is_file():
              raise RuntimeError("Generator did not create an image")
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              page.goto(image.as_uri())
              size = page.locator("img").evaluate("(img) => [img.naturalWidth, img.naturalHeight]")
              browser.close()
          if size != [1200, 630]:
              raise RuntimeError(f"Unexpected image dimensions: {size}")
          print(f"PASS: {tool['slug']} rendered and decoded at {size}")
          PY
      - name: Save diagnostic image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: og-runner-probe
          path: ${{ runner.temp }}/og-probe/*.jpg
          if-no-files-found: error
