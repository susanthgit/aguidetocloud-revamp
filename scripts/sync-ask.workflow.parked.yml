#
# GitHub only executes YAML that lives in .github/workflows/, so this copy is
# inert by construction. It is committed here purely so the design is not lost:
# it was written on 13 Aug 2026, never committed, and survived until 30 Aug 2026
# as a single untracked copy on one laptop.
#
# WHY IT IS PARKED RATHER THAN ENABLED
#
# Two independent reviews on 30 Aug 2026 (a hostile skeptic and a constructive
# reviewer, neither shown the other's findings) converged on the same blocking
# defect, which was then verified directly against this repo:
#
#   1. BLOCKING — untrusted content can become stored XSS.
#      functions/api/feedback.js accepts an unauthenticated public `message`
#      and writes it verbatim into a Discussion (L127). scripts/sync-ask.mjs
#      redacts email addresses only (redact(), L68-73) and does no HTML
#      escaping. hugo.toml:72 sets goldmark renderer unsafe = true, and
#      layouts/ask/single.html:35 emits .Content. So raw HTML typed into the
#      public feedback form would be rendered on a Google-indexed page.
#      This is not hypothetical: commit e04b45aa closed a live XSS in the
#      feedback renderer, the same trust boundary, earlier this month.
#
#   2. The comment below claiming the push triggers deploy.yml is FALSE.
#      A push authenticated with GITHUB_TOKEN does not trigger push workflows.
#      Cloudflare Pages still deploys via its own Git integration, so the site
#      would update while the repo's push-triggered QA never runs.
#
#   3. Pruning is fail-open. sync-ask.mjs deletes every generated page absent
#      from `wanted`. A successful-but-empty API response, or a filtering
#      regression, would delete all existing /ask/ pages and commit that.
#
# BEFORE ENABLING, AT MINIMUM
#
#   - Escape or allowlist-sanitise question content; add hostile-payload tests.
#   - Open a PR instead of pushing to main, so publication has a human gate.
#   - Refuse runs with implausible discussion counts; cap how much may be pruned.
#   - Fix the deploy.yml comment; move the cron off the top of the hour.
#   - Start with workflow_dispatch only, inspect the first run, then schedule.
#
# CONTEXT: /ask/ is live and shipped, but because this never ran, those pages
# have not refreshed since 13 Aug 2026 and several answered questions have no
# page. The staleness is real; the fix just needs the sanitising step first.
#
# ---------------------------------------------------------------------------
# Original file follows verbatim.
# ---------------------------------------------------------------------------

name: 💬 Sync /ask/ answer pages

# Mirrors answered GitHub Discussions into content/ask/*.md so each answer gets
# its own static, indexable URL. Without this the answers only exist inside the
# client-rendered list on /feedback/, where search engines never see them.
#
# The commit at the end triggers deploy.yml, same pattern as scan-youtube.yml.
#
# GITHUB_FEEDBACK_PAT is required — it's what lets the script page through every
# discussion. The public /api/discussions fallback only returns the 15 most
# recent, which is fine locally but would silently truncate the archive in CI.
#
# NOTE on the secret name: GitHub reserves the `GITHUB_` prefix for secret names,
# so the Actions secret CANNOT be called GITHUB_FEEDBACK_PAT (that name only
# exists as a Cloudflare Pages env var). We read FEEDBACK_PAT if you've made a
# narrowly-scoped one, else fall back to PERSONAL_PAT, which other workflows in
# this repo already use for cross-repo GitHub API calls. Either is mapped into
# the GITHUB_FEEDBACK_PAT env var the script expects.

on:
  schedule:
    - cron: '0 17 * * *'   # daily 17:00 UTC (5 AM NZST) — answers are written ad hoc
  workflow_dispatch:

concurrency:
  group: sync-ask
  cancel-in-progress: false

env:
  GITHUB_FEEDBACK_PAT: ${{ secrets.FEEDBACK_PAT || secrets.PERSONAL_PAT }}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Guard — PAT must be present
        run: |
          if [ -z "$GITHUB_FEEDBACK_PAT" ]; then
            echo "::error::Neither FEEDBACK_PAT nor PERSONAL_PAT is set. Without one the"
            echo "::error::script falls back to the public API (15 most recent only) and"
            echo "::error::would publish a truncated archive. Add a secret at:"
            echo "::error::  https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi

      - name: Sync answered discussions → content/ask/
        run: node scripts/sync-ask.mjs

      - name: Check for changes
        id: check
        run: |
          if [ -n "$(git status --porcelain content/ask/)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            git status --short content/ask/
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No new or updated answers."
          fi

      - name: Commit updated answer pages
        if: steps.check.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/ask/
          git commit -m "feat(ask): sync answered discussions to /ask/ pages

          Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          git push

      # The push above triggers deploy.yml automatically.
