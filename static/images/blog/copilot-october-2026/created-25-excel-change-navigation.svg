<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650">
<rect width="1400" height="650" fill="#f3efe3"/>
<text x="60" y="65.0" font-family="Segoe UI,Arial,sans-serif" font-size="36" font-weight="600" fill="#000000">From the Copilot reply to the changed object</text>
<text x="60" y="110.0" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#000000">Excel change navigation | Author illustration, not a product screenshot</text>
<rect x="60" y="160" width="605" height="245" rx="12" fill="#fcfbf5" stroke="#243953" stroke-width="2"/>
<text x="90" y="210.0" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="600" fill="#000000">IN THE REPLY</text>
<text x="90" y="270.0" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#000000">Copilot reports a workbook change</text>
<text x="90" y="306.0" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#000000">A supported link points to the object</text>
<text x="90" y="342.0" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#000000">Select the link to review it</text>
<rect x="735" y="160" width="605" height="245" rx="12" fill="#fcfbf5" stroke="#a3854c" stroke-width="2"/>
<text x="765" y="210.0" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="600" fill="#000000">IN THE WORKBOOK</text>
<text x="765" y="270.0" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#000000">The changed object is highlighted</text>
<text x="765" y="306.0" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#000000">Sheets, tables, ranges, charts and shapes</text>
<text x="765" y="342.0" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#000000">Inspect the result before relying on it</text>
<text x="60" y="475.0" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="600" fill="#000000">A sheet name printed in a reply is not proof of a working link.</text>
<text x="60" y="530.0" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#000000">Our capture did not expose a clickable reference; this explains the announced behaviour.</text>
<text x="60" y="600.0" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#000000">Source: Microsoft 365 Copilot release notes, 23 September 2026.</text>
</svg>