<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820">
<rect width="1500" height="820" fill="#f3efe3"/>
<text x="60" y="85" font-family="Segoe UI,Arial,sans-serif" font-size="40" font-weight="600" fill="#000000">Another pair of eyes, without agent-edit access</text>
<text x="60" y="140" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#000000">Conceptual illustration - not product UI or a tenant test</text>
<rect x="60" y="210" width="400" height="315" rx="12" fill="none" stroke="#243953" stroke-width="3"/>
<text x="83" y="269" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="600" fill="#000000">MAKER</text>
<text x="83" y="360" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#000000">Builds the agent.</text>
<text x="83" y="397" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#000000">Sets up its evaluations.</text>
<text x="83" y="434" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#000000">Keeps control of authoring.</text>
<rect x="550" y="210" width="400" height="315" rx="12" fill="none" stroke="#a3854c" stroke-width="3"/>
<text x="573" y="269" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="600" fill="#000000">EVALUATION RESULTS</text>
<text x="573" y="360" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#000000">Show what the tests found.</text>
<text x="573" y="397" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#000000">Give reviewers evidence</text>
<text x="573" y="434" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#000000">to inspect and discuss.</text>
<rect x="1040" y="210" width="400" height="315" rx="12" fill="none" stroke="#243953" stroke-width="3"/>
<text x="1063" y="269" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="600" fill="#000000">EVALUATION VIEWER</text>
<text x="1063" y="360" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#000000">Can see evaluation results</text>
<text x="1063" y="397" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#000000">without agent-editing rights.</text>
<text x="1063" y="434" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#000000">Can raise review questions.</text>
<text x="60" y="609" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="600" fill="#000000">Reviewing the evidence is different from changing the agent.</text>
<text x="60" y="709" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#000000">Conceptual role boundary, not a complete permissions matrix or a role-assignment test.</text>
<text x="60" y="796" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#000000">Microsoft Studio September roundup, published 7 October 2026</text>
</svg>