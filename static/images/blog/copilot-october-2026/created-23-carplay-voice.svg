<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650">
<rect width="1400" height="650" fill="#f3efe3"/>
<text x="60" y="65.0" font-family="Segoe UI,Arial,sans-serif" font-size="36" font-weight="600" fill="#000000">Copilot voice through Apple CarPlay</text>
<text x="60" y="110.0" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#000000">Concept only | Author illustration, not an Apple or Microsoft product screenshot</text>
<rect x="60" y="160" width="605" height="245" rx="12" fill="#fcfbf5" stroke="#243953" stroke-width="2"/>
<text x="90" y="210.0" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="600" fill="#000000">CONNECT</text>
<text x="90" y="270.0" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#000000">Connect an iPhone to CarPlay</text>
<text x="90" y="306.0" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#000000">Open Microsoft Copilot</text>
<text x="90" y="342.0" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#000000">on the CarPlay display</text>
<rect x="735" y="160" width="605" height="245" rx="12" fill="#fcfbf5" stroke="#a3854c" stroke-width="2"/>
<text x="765" y="210.0" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="600" fill="#000000">USE VOICE</text>
<text x="765" y="270.0" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#000000">Microsoft describes the Siri request:</text>
<text x="765" y="306.0" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#000000">&quot;Hey Siri, ask Copilot&quot;</text>
<text x="765" y="342.0" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#000000">No simulated dashboard or answer shown</text>
<text x="60" y="475.0" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="600" fill="#000000">Set up and familiarise yourself while safely parked.</text>
<text x="60" y="530.0" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#000000">Not tested in a car. Follow local road rules; do not interact with a screen while driving.</text>
<text x="60" y="600.0" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#000000">Source: Microsoft Support, Use Microsoft Copilot in Apple CarPlay.</text>
</svg>