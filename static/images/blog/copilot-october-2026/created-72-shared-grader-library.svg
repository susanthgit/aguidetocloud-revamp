<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820">
<rect width="1500" height="820" fill="#f3efe3"/>
<text x="60" y="85" font-family="Segoe UI,Arial,sans-serif" font-size="40" font-weight="600" fill="#000000">Agree on the check, then reuse it</text>
<text x="60" y="140" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#000000">Conceptual illustration - not product UI or a tenant test</text>
<rect x="60" y="210" width="400" height="315" rx="12" fill="none" stroke="#243953" stroke-width="3"/>
<text x="83" y="269" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="600" fill="#000000">DEFINE THE GRADER</text>
<text x="83" y="360" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#000000">Write the evaluation criteria.</text>
<text x="83" y="397" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#000000">Define what passes or fails.</text>
<text x="83" y="434" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#000000">Check the grader itself.</text>
<rect x="550" y="210" width="400" height="315" rx="12" fill="none" stroke="#a3854c" stroke-width="3"/>
<text x="573" y="269" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="600" fill="#000000">KEEP IT IN THE LIBRARY</text>
<text x="573" y="360" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#000000">Manage the custom grader</text>
<text x="573" y="397" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#000000">as a reusable evaluation asset.</text>
<text x="573" y="434" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#000000">Avoid duplicate rule copies.</text>
<rect x="1040" y="210" width="400" height="315" rx="12" fill="none" stroke="#243953" stroke-width="3"/>
<text x="1063" y="269" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="600" fill="#000000">REUSE IN TESTS</text>
<text x="1063" y="360" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#000000">Use it across agents</text>
<text x="1063" y="397" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#000000">and test sets.</text>
<text x="1063" y="434" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#000000">Review what the scores mean.</text>
<text x="60" y="609" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="600" fill="#000000">The same marking guide makes comparisons more useful.</text>
<text x="60" y="709" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#000000">A reusable grader is not automatically a correct grader.</text>
<text x="60" y="796" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#000000">Microsoft Studio September roundup, published 7 October 2026</text>
</svg>