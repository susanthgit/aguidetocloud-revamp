<text x="60" y="609" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="600" fill="#000000">The preview extends reasoning to notes and file-column content.</text>
<text x="60" y="709" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#000000">Up to 15 tables per source. File-content limits apply; later setup can need two-day backfill.</text>
