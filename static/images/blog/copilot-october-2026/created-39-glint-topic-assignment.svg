<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="730" viewBox="0 0 1400 730">
<rect width="1400" height="730" fill="#f3efe3"/>
<text x="60" y="65.0" font-family="Segoe UI,Arial,sans-serif" font-size="38" font-weight="600" fill="#000000">From survey comments to topics</text>
<text x="60" y="108.0" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#000000">Viva Glint  |  Author illustration, not a product screenshot</text>
<rect x="60" y="150" width="590" height="210" rx="12" fill="#fcfbf5" stroke="#243953" stroke-width="2"/>
<text x="90" y="197.0" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="600" fill="#000000">INPUT</text>
<text x="90" y="245.0" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#000000">Survey comments + survey context</text>
<text x="90" y="282.5" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#000000">Supported ad-hoc and recurring surveys</text>
<text x="90" y="320.0" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#000000">Existing confidentiality rules still apply</text>
<text x="678" y="270.0" font-family="Segoe UI,Arial,sans-serif" font-size="40" font-weight="600" fill="#000000">&gt;</text>
<rect x="735" y="150" width="605" height="210" rx="12" fill="#fcfbf5" stroke="#a3854c" stroke-width="2"/>
<text x="765" y="197.0" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="600" fill="#000000">COPILOT-ENHANCED ASSIGNMENT</text>
<text x="765" y="245.0" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#000000">Classifies comments into approved topics</text>
<text x="765" y="282.5" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#000000">Uses the existing org-wide Copilot setting</text>
<text x="765" y="320.0" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#000000">No separate topic-assignment toggle</text>
<rect x="60" y="400" width="1280" height="150" rx="12" fill="#fcfbf5" stroke="#a3854c" stroke-width="2"/>
<text x="90" y="445.0" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="600" fill="#000000">VIEW THE RESULTS</text>
<text x="90" y="493.0" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="400" fill="#000000">Reports  &gt;  Comments  &gt;  Topics</text>
<text x="90" y="532.0" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="400" fill="#000000">Review the related comments before drawing conclusions.</text>
<text x="60" y="600.0" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="600" fill="#000000">Not a new chat prompt. Not a reprocessing of historical reports.</text>
<text x="60" y="646.0" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#000000">Topic assignment can be wrong; it is not a basis for employment decisions.</text>
<text x="60" y="694.0" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#000000">Source: Microsoft Learn, Use Viva Glint&#x27;s Comments report. No employee data or sample metrics shown.</text>
</svg>