<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650">
<rect width="1400" height="650" fill="#f3efe3"/>
<text x="60" y="65.0" font-family="Segoe UI,Arial,sans-serif" font-size="36" font-weight="600" fill="#000000">New Pages: two storage paths during the change</text>
<text x="60" y="110.0" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#000000">After rollout reaches the tenant | Author illustration, not a product screenshot</text>
<rect x="60" y="160" width="605" height="245" rx="12" fill="#fcfbf5" stroke="#243953" stroke-width="2"/>
<text x="90" y="210.0" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="600" fill="#000000">NEW CONTENT</text>
<text x="90" y="270.0" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#000000">Pages from Chat, the app or new Notebooks</text>
<text x="90" y="306.0" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#000000">Stored in OneDrive for Business</text>
<text x="90" y="342.0" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#000000">OneDrive governance policies apply</text>
<rect x="735" y="160" width="605" height="245" rx="12" fill="#fcfbf5" stroke="#a3854c" stroke-width="2"/>
<text x="765" y="210.0" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="600" fill="#000000">EXISTING CONTENT</text>
<text x="765" y="270.0" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#000000">Existing pages are not migrated</text>
<text x="765" y="306.0" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#000000">Existing Notebooks keep using</text>
<text x="765" y="342.0" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#000000">SharePoint Embedded for their pages</text>
<text x="60" y="475.0" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="600" fill="#000000">New does not mean migrated.</text>
<text x="60" y="530.0" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#000000">Check both storage locations when planning retention and discovery.</text>
<text x="60" y="600.0" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#000000">Source: Message Center MC1449182, updated 8 October 2026.</text>
</svg>