# ============================================
# M365 Licence Picker — Add-on Definitions
# Indicative USD list prices, per user/month.
# Last checked: September 2026
# ============================================
# USD ONLY — BY DESIGN. Do not add price_aud / price_nzd / price_gbp / price_eur.
# Microsoft's regional prices are NOT a flat FX multiple of the USD price, so any
# converted figure is fabricated. 92 such values were removed on 2026-09-14.
# Enforced by: scripts/check-licence-picker.mjs (runs in pre-push).
# ============================================
# requires_base: plan IDs that can use this add-on
# already_in: plan IDs that already include this feature (don't buy separately)
# provides: feature IDs this add-on unlocks
# ============================================

[[addons]]
id = "copilot-addon"
name = "Microsoft 365 Copilot"
price_usd = 30
provides = ["m365-copilot"]
requires_base = ["bs", "bp", "m365-e3", "m365-e5"]
already_in = ["m365-e7"]
description = "AI assistant across all M365 apps — Word, Excel, PPT, Outlook, Teams"
note = "Not available for Business Basic, O365-only, or Frontline plans"

